<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Macro Dashboard</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <div>
        <h1 class="wordmark">
          <svg class="wordmark-mark" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="1" y="1" width="22" height="22" rx="6"/>
            <polyline points="5,16 9,12 12,14 15,8 19,9"/>
          </svg>
          <span class="wordmark-macro">Macro</span>
          <span class="wordmark-dashboard">Dashboard</span>
        </h1>
        <p class="updated" id="updated"></p>
      </div>
      <div class="topbar-actions">
        <button type="button" class="search-button" id="search-button" aria-haspopup="dialog"
                aria-label="Søg" aria-keyshortcuts="Control+K Meta+K /">
          <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
          </svg>
          <span class="search-button-text">Søg</span>
          <kbd class="search-shortcut" id="search-shortcut" aria-hidden="true">Ctrl K</kbd>
        </button>
        <div class="range-picker" id="range-picker" role="group" aria-label="Periode i graferne">
          <button type="button" data-years="1">1 år</button>
          <button type="button" data-years="5">5 år</button>
          <button type="button" data-years="10">10 år</button>
          <button type="button" data-years="0">Maks</button>
          <label class="range-custom">
            <input type="number" id="range-years" min="1" max="100" step="1" inputmode="numeric"
                   placeholder="–" aria-label="Antal år i graferne (1–100)">
            <span aria-hidden="true">år</span>
          </label>
        </div>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sektioner"></nav>
    <nav class="subtabs" id="subtabs" hidden></nav>
  </header>

  <main>
    <p class="load-error" id="load-error" hidden>
      Data kunne ikke indlæses. Kør <code>python3 fetch_data.py</code> for at hente data.
    </p>
    <div class="panel-grid" id="panels"></div>
  </main>

  <!-- One panel in full screen; filled in by app.js. -->
  <dialog class="panel-dialog" id="panel-dialog" aria-labelledby="panel-dialog-title">
    <div class="panel-dialog-box" id="panel-dialog-box"></div>
  </dialog>

  <!-- The search palette. showModal() makes the rest of the page inert and keeps Tab inside. -->
  <dialog class="search-dialog" id="search-dialog" aria-label="Søg i dashboardet">
    <div class="search-box">
      <div class="search-field">
        <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
          <circle cx="11" cy="11" r="7"/><line x1="16.5" y1="16.5" x2="21" y2="21"/>
        </svg>
        <input id="search-input" type="text" role="combobox" aria-label="Søg efter land, indikator eller råvare"
               aria-autocomplete="list" aria-expanded="false" aria-controls="search-results"
               autocomplete="off" spellcheck="false" placeholder="Søg efter land, indikator eller råvare">
        <kbd class="search-esc" aria-hidden="true">Esc</kbd>
      </div>
      <ul class="search-results" id="search-results" role="listbox" aria-label="Resultater"></ul>
      <p class="search-status" id="search-status" role="status"></p>
      <p class="search-hint" aria-hidden="true">↑ ↓ vælg · Enter åbn · Esc luk</p>
    </div>
  </dialog>

  <!-- data.js defines window.MACRO_DATA; it is generated by fetch_data.py -->
  <script src="data/data.js"></script>
  <!-- Pinned versions with integrity hashes: the browser refuses a file that has been altered. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"
          integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws"
          crossorigin="anonymous"></script>
  <!-- Zoom and pan in full screen; the plugin uses Hammer for touch gestures and dragging. -->
  <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8/hammer.min.js"
          integrity="sha384-Cs3dgUx6+jDxxuqHvVH8Onpyj2LF1gKZurLDlhqzuJmUqVYMJ0THTWpxK5Z086Zm"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.2.0/dist/chartjs-plugin-zoom.min.js"
          integrity="sha384-dwwI6ICEN/0ZQlS5owhUa/6ZzvwUPmjH45bFVCAcjgjTulbHJvlE+TGU3g1k0N3R"
          crossorigin="anonymous"></script>
  <script src="lib.js"></script>
  <script src="app.js"></script>
</body>
</html>

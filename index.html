<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makro-dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Makro-dashboard</h1>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sektioner"></nav>
  </header>

  <main>
    <p class="load-error" id="load-error" hidden>
      Data kunne ikke indlæses. Kør <code>python3 fetch_data.py</code> for at hente data.
    </p>
    <div class="panel-grid" id="panels"></div>
  </main>

  <!-- data.js defines window.MACRO_DATA; it is generated by fetch_data.py -->
  <script src="data/data.js"></script>
  <script src="app.js"></script>
</body>
</html>

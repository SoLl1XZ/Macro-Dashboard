<!doctype html>
<html lang="da">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Makro-dashboard</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <h1>Makro-dashboard</h1>
      <div class="range-picker" id="range-picker" role="group" aria-label="Periode i graferne">
        <button type="button" data-years="1">1 år</button>
        <button type="button" data-years="5">5 år</button>
        <button type="button" data-years="10">10 år</button>
        <button type="button" data-years="0">Maks</button>
      </div>
    </div>
    <nav class="tabs" id="tabs" aria-label="Sektioner"></nav>
  </header>

  <main>
    <p class="load-error" id="load-error" hidden>
      Data kunne ikke indlæses. Kør <code>python3 fetch_data.py</code> for at hente data.
    </p>
    <div class="panel-grid" id="panels"></div>
  </main>

  <!-- data.js defines window.MACRO_DATA; it is generated by fetch_data.py -->
  <script src="data/data.js"></script>
  <!-- Pinned versions with integrity hashes: the browser refuses a file that has been altered. -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1/dist/chart.umd.min.js"
          integrity="sha384-jb8JQMbMoBUzgWatfe6COACi2ljcDdZQ2OxczGA3bGNeWe+6DChMTBJemed7ZnvJ"
          crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns@3.0.0/dist/chartjs-adapter-date-fns.bundle.min.js"
          integrity="sha384-cVMg8E3QFwTvGCDuK+ET4PD341jF3W8nO1auiXfuZNQkzbUUiBGLsIQUE+b1mxws"
          crossorigin="anonymous"></script>
  <script src="app.js"></script>
</body>
</html>

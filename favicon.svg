<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">
  <!-- The wordmark's mark: a small line chart in a rounded frame, with the page's colours. -->
  <style>
    .frame { fill: #fcfcfb; stroke: #0b0b0b; }
    .line { stroke: #2a78d6; }
    @media (prefers-color-scheme: dark) {
      .frame { fill: #1a1a19; stroke: #ffffff; }
      .line { stroke: #3987e5; }
    }
  </style>
  <rect class="frame" x="1" y="1" width="22" height="22" rx="6" stroke-width="1.6"/>
  <polyline class="line" points="5,16 9,12 12,14 15,8 19,9" fill="none" stroke-width="2.2"
            stroke-linecap="round" stroke-linejoin="round"/>
</svg>

# Fetches fresh macro data every morning, commits it, and publishes the dashboard to GitHub Pages.
name: Update data and publish

on:
  schedule:
    # 06:17 UTC (08:17 Danish summer time): not on the hour, when GitHub often skips
    # scheduled runs because so many workflows start then.
    - cron: "17 6 * * *"
  workflow_dispatch: # adds a "Run workflow" button under the Actions tab
  push:
    branches: [main] # publish code changes right away

# Never run two updates at once: both would try to commit data.js.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write # to commit data/data.js
      issues: write # to report failed sources and runs
    env:
      GH_TOKEN: ${{ github.token }} # for the gh command in the report steps
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python -m unittest discover tests

      # The page's pure logic (lib.js) is tested with Node's built-in test runner;
      # Node is preinstalled on GitHub's Ubuntu runners.
      - name: Run JavaScript tests
        run: node --test tests/js/*.test.js

      - name: Fetch data
        run: python fetch_data.py

      # One open issue "Datakilder fejler" while sources fail: a run with failures opens it or
      # comments on it, the first run without closes it. GitHub mails the owner about both.
      - name: Report failed sources
        run: |
          body=$(python health.py)
          open=$(gh issue list --label datakilder --state open --json number --jq '.[0].number // empty')
          if [ -n "$body" ]; then
            body="$body"$'\n\n'"Kørsel: $RUN_URL"
            if [ -n "$open" ]; then
              gh issue comment "$open" --body "$body"
            else
              gh label create datakilder --color d93f0b --description "En datakilde fejler" --force
              gh issue create --title "Datakilder fejler" --label datakilder --body "$body"
            fi
          elif [ -n "$open" ]; then
            gh issue close "$open" --comment "Alle kilder virker igen: $RUN_URL"
          fi

      # The page with the new data in headless Chrome at 320, 768 and 1280 px: a page error, an
      # empty chart, overflow or two lines in one colour stop the run before the data is
      # committed or published. Chrome and Node 22 are preinstalled on GitHub's runners.
      - name: Stress test the page
        run: |
          python -m http.server 8765 --bind 127.0.0.1 &
          node tests/run_browser_stress.mjs http://127.0.0.1:8765/index.html

      # Pushes made with the workflow's own token don't trigger new runs, so this can't loop.
      # Only main commits data: a run started by hand on another branch is a test run.
      - name: Commit data
        if: github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/data.js
          if git diff --cached --quiet; then
            echo "No data changes."
          else
            git commit -m "Update data $(date -u +%Y-%m-%d)"
            # A run queued behind another (e.g. GitHub sending one push twice) starts without that
            # run's data commit; this commit only holds data.js, so keep this run's newer data.
            git pull --rebase -X theirs
            git push
          fi

      # The same for the run itself (a failing test, fetch or stress test): an issue while it
      # fails, closed by the next run that gets this far.
      - name: Close the failed-run issue
        run: |
          open=$(gh issue list --label korsel --state open --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then gh issue close "$open" --comment "Kørslen virker igen: $RUN_URL"; fi

      - name: Report a failed run
        if: failure()
        run: |
          open=$(gh issue list --label korsel --state open --json number --jq '.[0].number // empty')
          body="Den automatiske kørsel fejlede. Se hvilket trin og hvorfor: $RUN_URL"
          if [ -n "$open" ]; then
            gh issue comment "$open" --body "$body"
          else
            gh label create korsel --color b60205 --description "Den automatiske kørsel fejler" --force
            gh issue create --title "Kørslen fejler" --label korsel --body "$body"
          fi

  deploy:
    needs: update
    if: github.ref == 'refs/heads/main' # a test run on another branch publishes nothing
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # includes the data commit made by the update job

      # Publish only what the page needs, not the Python code and tests.
      - name: Collect site files
        run: |
          mkdir _site
          cp index.html lib.js app.js style.css favicon.svg _site/
          cp -r data _site/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v5
